name: Intel security validation

on:
  workflow_dispatch:
  push:
    branches: [security-hardening]
    paths: [.github/workflows/validate-intel-security.yml]

permissions:
  contents: read

jobs:
  intel:
    if: github.repository == 'batultara15/strix'
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      STRIX_TELEMETRY: 'false'
      STRIX_WHEEL_PLATFORM_TAG: macosx_11_0_x86_64
      OPENSSL_STATIC: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: false
      - name: Validate native Intel build and crypto
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          sw_vers
          git rev-parse HEAD
          brew install openssl@3 rust
          export OPENSSL_DIR="$(brew --prefix openssl@3)"
          uv sync --frozen
          uv build --wheel
          uv run --frozen pyinstaller strix.spec --noconfirm
          uv run --frozen pytest -q tests/test_crypto_compatibility.py
          file dist/strix
          test "$(lipo -archs dist/strix)" = x86_64
          dist/strix --version
          dist/strix --help > /dev/null
          echo 'INTEL_BUILD_CRYPTO_ARCH_VERSION_HELP_PASS'
